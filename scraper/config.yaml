# Configuración editable del buscador de empleo.
# Puedes tocar cualquier lista de aquí sin tener que entender el código.

search:
  cities:
    - name: "La Laguna"
      aliases:
        - "la laguna"
        - "san cristóbal de la laguna"
        - "san cristobal de la laguna"
        - "sc de la laguna"
    - name: "Santa Cruz de Tenerife"
      aliases:
        - "santa cruz de tenerife"
        - "santa cruz tenerife"
        - "sc de tenerife"
        - "sta cruz de tenerife"
        - "s/c de tenerife"
        - "s.c. de tenerife"
        - "santa cruz"
        - "sta cruz"
        - "sta. cruz"

  # Si una oferta solo menciona la provincia/isla (sin precisar La Laguna o
  # Santa Cruz), igualmente se incluye pero puntúa menos que un match exacto.
  province_fallback_aliases:
    - "tenerife"
    - "islas canarias"
    - "canarias"
    - "santa cruz de tenerife" # también es el nombre de la provincia

# Cada perfil de búsqueda vive aquí como una "categoría" independiente, con
# su propia lista de términos de búsqueda, marcas/empresas prioritarias, y
# palabras clave "señal" que confirman que una oferta de una empresa NO
# reconocida es igualmente relevante para esa categoría. Añadir una
# categoría nueva es solo añadir un bloque más aquí; el resto del sistema
# (scoring, dedupe, la web) funciona igual para todas.
categories:
  moda:
    label: "Moda y retail"

    # Términos que se usan para consultar las fuentes que aceptan palabras
    # clave (InfoJobs, Job Today, Indeed). Jooble usa su propia lista más
    # corta más abajo (sources.jooble.keywords) para no gastar su cupo.
    search_keywords:
      - "dependienta"
      - "dependiente"
      - "dependiente moda"
      - "vendedor tienda ropa"
      - "vendedora moda"
      - "retail moda"
      - "atención al cliente tienda"

    # Marcas de moda gama media/premium que interesan especialmente. Se
    # comparan en minúsculas y sin acentos contra empresa+título+descripción.
    priority_brands:
      - "Zara"
      - "Mango"
      - "Bershka"
      - "Stradivarius"
      - "Pull & Bear"
      - "Massimo Dutti"
      - "Oysho"
      - "El Corte Inglés"
      - "Tous"
      - "Scalpers"
      - "JD Sports"
      - "JD Spain Sports Fashion"
      - "Cortefiel"
      - "Springfield"
      - "Women'Secret"
      - "Kenzo"
      - "Koala Bay"
      - "Bouty"
      - "Levi's"
      - "Levis"
      - "Punt Roma"
      - "Guess"
      - "Desigual"

    # Cadenas que NUNCA deben aparecer, aunque encajen por palabra clave o ciudad.
    excluded_brands:
      - "Primark"
      - "Kiabi"
      - "Lefties"
      - "C&A"

    # Palabras que indican que una oferta de una empresa NO reconocida como
    # marca prioritaria es igualmente relevante. Deliberadamente estricto:
    # términos como "dependiente" o "atención al cliente" se quedan fuera
    # porque valen para cualquier comercio (supermercados, kioscos...), no
    # solo moda. Si la empresa SÍ está en priority_brands, esta lista no
    # aplica: se asume que es relevante directamente.
    signal_keywords:
      - "moda"
      - "boutique"
      - "textil"
      - "calzado"
      - "complementos"
      - "visual merchandising"
      - "tienda de ropa"
      - "ventas moda"
      - "retail moda"
      - "dependienta de moda"
      - "vendedor/a de moda"

  audiovisual:
    label: "Comunicación audiovisual"

    search_keywords:
      - "redactor"
      - "redactor multimedia"
      - "community manager"
      - "editor de vídeo"
      - "operador de cámara"
      - "realizador audiovisual"
      - "técnico de sonido"
      - "productor audiovisual"
      - "diseñador gráfico"
      - "periodista"

    # Empresas/entidades de referencia en Canarias para este perfil.
    priority_brands:
      - "RTVC"
      - "Radio Televisión Canaria"
      - "Televisión Pública de Canarias"

    excluded_brands: []

    # Señal de relevancia para empresas no reconocidas (agencias de
    # comunicación, productoras pequeñas, etc.). Deliberadamente estricto,
    # igual que en moda: "comunicación" o "redes sociales" sueltos aparecen
    # como requisito blando en anuncios de cualquier sector, así que solo
    # cuentan frases específicas o el propio nombre del puesto.
    signal_keywords:
      - "audiovisual"
      - "comunicación audiovisual"
      - "comunicación digital"
      - "gabinete de comunicación"
      - "departamento de comunicación"
      - "contenidos digitales"
      - "gestión de redes sociales"
      - "producción de vídeo"
      - "producción audiovisual"
      - "edición de vídeo"
      - "redactor"
      - "redactora"
      - "guion"
      - "periodis"

contract_type:
  full_time_patterns:
    - "jornada completa"
    - "tiempo completo"
    - "jornada 100%"
    - "40 horas"
    - "40h"
  part_time_patterns:
    - "media jornada"
    - "jornada parcial"
    - "tiempo parcial"
    - "parcial"
    - "20 horas"
    - "20h"
    - "horas semanales"

scoring:
  brand_priority: 40
  full_time: 25
  part_time: 8
  city_exact_match: 20
  province_fallback_match: 5
  keyword_match: 10
  recency_max_bonus: 15
  recency_days_for_zero_bonus: 10

# Si una oferta lleva más de N ejecuciones seguidas sin aparecer en ninguna
# fuente, se considera caducada/cubierta y se retira del listado activo.
expiry:
  max_missed_runs: 3

sources:
  jooble:
    enabled: true
    # La API key se lee de la variable de entorno JOOBLE_API_KEY (secret de
    # GitHub Actions), nunca se guarda aquí.
    # La cuenta gratuita tiene un tope de 500 peticiones. Con 2 ciudades x 2
    # keywords x 2 ejecuciones/día son ~240 peticiones al mes, con margen.
    # Si algún día se sube el límite, se puede ampliar esta lista (una
    # búsqueda por categoría es lo mínimo para que Jooble cubra ambas).
    keywords:
      - "dependienta moda"
      - "comunicación audiovisual"
  infojobs:
    enabled: true
    # Ciudades donde InfoJobs sí soporta scoping a nivel de municipio en la URL
    # (además de "santa-cruz-de-tenerife", que es la provincia y ya incluye la
    # capital). Las marcas/empresas de cada categoría aparecen igualmente en
    # esta búsqueda general por palabra clave, así que no hace falta un
    # scraper aparte por marca.
    city_slugs:
      - "la-laguna"
      - "santa-cruz-de-tenerife"
  jobtoday:
    enabled: true
  indeed:
    enabled: true
  mango_workday:
    enabled: true
  rtvc:
    enabled: true
